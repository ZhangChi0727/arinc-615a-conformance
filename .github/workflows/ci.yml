name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate research baseline
        run: |
          python scripts/check_repo_baseline.py

      - name: Validate project overview synchronization
        run: |
          python scripts/sync_project_overview.py --check

      - name: Validate M1 CRS synchronization
        run: |
          python scripts/sync_m1_crs.py --check

      - name: Compile with SyntaxWarning as error
        run: |
          python -W error::SyntaxWarning -m compileall -q src scripts tests

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short
