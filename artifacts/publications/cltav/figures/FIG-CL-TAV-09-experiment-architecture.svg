<!-- plantuml-source
@startuml FIG-CL-TAV-09
skinparam shadowing false
title FIG-CL-TAV-09 Experiment architecture\nSysML 1.6 notation-based views; executable/metamodel conformance is not claimed\nevaluator-only truth is never an algorithm input

rectangle &quot;Controlled scene / config\n(IUT, fault plan, resource mode)&quot; as Scene
rectangle &quot;Independent truth record\n(evaluator only)&quot; as Truth
rectangle &quot;Comparison arms\nCL-T / CL-A / CL-TA / CL-LOOP&quot; as Arms
rectangle &quot;Observations and resource log\n(algorithm-visible)&quot; as Obs
rectangle &quot;Validity check\n(invalid, equivalent, missing)&quot; as Valid
rectangle &quot;Metrics with denominators\nEXP-CLTAV-DETECT / LOCATE / ABLATION&quot; as Metrics
rectangle &quot;RQ / claims\n(no unrun numbers)&quot; as Claims

Scene --&gt; Arms : same declared pool and action library
Scene --&gt; Truth : injection plan + execution confirmation
Truth -[#red,dashed]-&gt; Arms : forbidden leakage
Arms --&gt; Obs : algorithm-visible Izk, q, cost
Obs --&gt; Valid
Truth --&gt; Valid : evaluator-only confirmation
Valid --&gt; Metrics : attempt and answered-subset denominators
Metrics --&gt; Claims : comparable projections only

note right of Truth
  Evaluator truth must not enter
  IF-SELECT-ADMIT, IF-PRED-OBS,
  IF-HIST-UPDATE or IF-EXECUTE-RECORD.
  IF-OBS-INTERPRET, IF-PREP-RECOVER,
  IF-EQUIV and IF-RESOURCE-STOP stay
  algorithm-visible only.
end note
note bottom of Arms
  Same pool is not a gift of later CL-LOOP
  records to other arms, and not a fictional
  sampling charge to CL-A.
  Groups: EXP-CLTAV-DETECT, EXP-CLTAV-LOCATE,
  EXP-CLTAV-ABLATION.
end note
@enduml

-->
