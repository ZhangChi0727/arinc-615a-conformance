<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="900" viewBox="0 0 1580 900" style="background:#FFFFFF"><desc id="plantuml-source"><![CDATA[
@startuml FIG-CL-TAV-05
skinparam shadowing false
title FIG-CL-TAV-05 Closed-loop activity\nSysML 1.6 notation-based views; executable/metamodel conformance is not claimed\npredict before select; exclusive TEST/Prep/Recover/Admit; charge once; effect classes

' E-S1-STOP from=S1 to=StopGate polarity=stop guard=already decided
' E-S2-GAP from=S2 to=PredictionGap polarity=stop guard=Recover and Prep ineligible
' E-S7-S1 from=S7 to=S1 polarity=retry via=LoopS1
' E-S9-S10 from=S9 to=S10 polarity=advance
' E-S10-S1 from=S10 to=S1 polarity=continue guard=no stop

start
:S0 Idle; SessionContext unique; HistoryHandle; BUDGET xor ROUNDS; retry=0;
repeat
  :S1 IF-RESOURCE-STOP gate;
  if (already A2-A5 or P1-P5?) then (yes)
    :E-S1-STOP already decided stop;
    stop
  else (no)
    :S2 IF-PRED-OBS predict classes;
    if (PredictionGapError and Recover and Prep not eligible?) then (yes)
      :E-S2-GAP TEST-scoped named prediction-gap; Recover and Prep ineligible;
      stop
    else (no)
      :S3 IF-SELECT-ADMIT exclusive kind; freeze qUsedAtSelect;
      if (kind ADMIT?) then (yes)
        stop
      elseif (kind TEST and S empty?) then (yes)
        :named spec error; never argmin empty S;
        stop
      elseif (kind PREP or RECOVER?) then (yes)
        :keep named Prep/Recover; do not enter TEST minimax;
      else (TEST nonempty)
        :one-step minimax on predicted nonempty classes;
      endif
      :S4 Charge cost once;
      :S5 IF-EXECUTE-RECORD effect class;
      :S6 IF-OBS-INTERPRET unless effect class already returned;
      if (CONFIRMED-NOT-SENT or UNKNOWN-EFFECT or prepErr or unconfirmed Recover?) then (yes)
        :S7 classify effect; CONFIRMED-NOT-SENT keeps q; UNKNOWN-EFFECT invalidates q;
        if (retry cap reached?) then (yes)
          :Stop-Error; not A5/Stop-Budget;
          stop
        else (retry remaining)
          :E-S7-S1 unconfirmed Recover and effect classes share the retry back-edge to S1;
        endif
      else (record valid)
        if (Recover confirmed?) then (yes)
          :S8 sole writer of KNOWN(declaredTarget,evidence); IF-PREP-RECOVER does not write Gamma;
          :E-S9-S10 S9 IF-HIST-UPDATE reads qUsedAtSelect and postSummary;
        else (TEST or Prep)
          :E-S9-S10 S9 IF-HIST-UPDATE reads qUsedAtSelect and postSummary;
        endif
        :S10 P1-P5 via IF-RESOURCE-STOP and IF-EQUIV;
        if (P-stop?) then (yes)
          stop
        else (no stop)
          :E-S10-S1 continue to next S1;
        endif
      endif
    endif
  endif
repeat while (no stop?) is (continue)
note right
  admissible A then selectable S; Admit A1-A5
  XOR BUDGET(cmin,B) / ROUNDS(Kmax)
  strictly-reducing TEST else Prep else Recover
  Charge cost once; Hk update
  ERROR ErrorHandle unknown-effect
  confirmed not sent keeps q; CONFIRMED-NOT-SENT is not UNKNOWN
  unconfirmed Recover joins S7
  no stop returns S10 to S1
  P1 P5 Stop-Empty Stop-Singleton Stop-645
  Stop-Equivalent Stop-Budget Stop-Error Stop-NoDistinguisher
end note
stop
@enduml

]]></desc><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#181818"/></marker></defs><text x="20" y="24" font-size="16" font-family="sans-serif" font-weight="700">FIG-CL-TAV-05-closed-loop-activity</text><text x="20" y="44" font-size="12" font-family="sans-serif">SysML 1.6 notation-based views; executable/metamodel conformance is not claimed</text><rect x="40" y="70" width="210" height="58" data-node="S0" fill="#F7F7F7" stroke="#181818"/><text x="48" y="88" font-size="12" font-family="sans-serif"><tspan x="48" dy="0">S0 Idle; Gamma unique</tspan></text><rect x="40" y="160" width="210" height="64" data-node="S1" fill="#F7F7F7" stroke="#181818"/><text x="48" y="178" font-size="12" font-family="sans-serif"><tspan x="48" dy="0">S1 stop gate</tspan></text><rect x="40" y="760" width="210" height="64" data-node="S10" fill="#F7F7F7" stroke="#181818"/><text x="48" y="778" font-size="12" font-family="sans-serif"><tspan x="48" dy="0">S10 P-stops</tspan></text><rect x="280" y="760" width="190" height="64" data-node="StopP" fill="#F7F7F7" stroke="#181818"/><text x="288" y="778" font-size="12" font-family="sans-serif"><tspan x="288" dy="0">P-stop return</tspan></text><rect x="500" y="760" width="230" height="64" data-node="LoopS1" fill="#F7F7F7" stroke="#181818"/><text x="508" y="778" font-size="12" font-family="sans-serif"><tspan x="508" dy="0">retry back-edge to S1</tspan></text><rect x="300" y="160" width="240" height="64" data-node="StopGate" fill="#F7F7F7" stroke="#181818"/><text x="308" y="178" font-size="12" font-family="sans-serif"><tspan x="308" dy="0">S1 already decided stop</tspan></text><rect x="580" y="70" width="200" height="64" data-node="S2" fill="#F7F7F7" stroke="#181818"/><text x="588" y="88" font-size="12" font-family="sans-serif"><tspan x="588" dy="0">S2 predict</tspan></text><rect x="820" y="70" width="340" height="64" data-node="PredictionGap" fill="#F8D7DA" stroke="#181818"/><text x="828" y="88" font-size="12" font-family="sans-serif"><tspan x="828" dy="0">TEST gap; Recover and Prep ineligible</tspan></text><rect x="580" y="170" width="260" height="64" data-node="S3" fill="#F7F7F7" stroke="#181818"/><text x="588" y="188" font-size="12" font-family="sans-serif"><tspan x="588" dy="0">S3 exclusive kind; freeze snapshot</tspan></text><rect x="880" y="170" width="200" height="64" data-node="Admit" fill="#F7F7F7" stroke="#181818"/><text x="888" y="188" font-size="12" font-family="sans-serif"><tspan x="888" dy="0">Admit A2-A5</tspan></text><rect x="300" y="290" width="200" height="58" data-node="S4" fill="#F7F7F7" stroke="#181818"/><text x="308" y="308" font-size="12" font-family="sans-serif"><tspan x="308" dy="0">S4 charge once</tspan></text><rect x="540" y="290" width="230" height="58" data-node="S5" fill="#F7F7F7" stroke="#181818"/><text x="548" y="308" font-size="12" font-family="sans-serif"><tspan x="548" dy="0">S5 execute effect class</tspan></text><rect x="810" y="290" width="210" height="58" data-node="S6" fill="#F7F7F7" stroke="#181818"/><text x="818" y="308" font-size="12" font-family="sans-serif"><tspan x="818" dy="0">S6 interpret</tspan></text><rect x="300" y="420" width="390" height="78" data-node="S7" fill="#F8D7DA" stroke="#181818"/><text x="308" y="438" font-size="12" font-family="sans-serif"><tspan x="308" dy="0">S7 CONFIRMED-NOT-SENT keeps q; UNKNOWN-EFFECT</tspan><tspan x="308" dy="15">invalidates q</tspan></text><rect x="720" y="430" width="220" height="58" data-node="StopError" fill="#F8D7DA" stroke="#181818"/><text x="728" y="448" font-size="12" font-family="sans-serif"><tspan x="728" dy="0">retry cap Stop-Error</tspan></text><rect x="980" y="420" width="230" height="64" data-node="S8" fill="#FFF3CD" stroke="#181818"/><text x="988" y="438" font-size="12" font-family="sans-serif"><tspan x="988" dy="0">S8 sole KNOWN writer</tspan></text><rect x="1240" y="420" width="280" height="64" data-node="Unconfirmed" fill="#F8D7DA" stroke="#181818"/><text x="1248" y="438" font-size="12" font-family="sans-serif"><tspan x="1248" dy="0">unconfirmed Recover to S7</tspan></text><rect x="720" y="580" width="400" height="70" data-node="S9" fill="#F7F7F7" stroke="#181818"/><text x="728" y="598" font-size="12" font-family="sans-serif"><tspan x="728" dy="0">S9 hist reads qUsedAtSelect and postSummary</tspan></text><line x1="145" y1="128" x2="145" y2="160" data-from="S0" data-to="S1" data-edge="E-S0-S1" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="250" y1="192" x2="580" y2="102" data-from="S1" data-to="S2" data-edge="E-S1-S2" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="250" y1="192" x2="300" y2="192" data-from="S1" data-to="StopGate" data-edge="E-S1-STOP" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="680" y1="134" x2="710" y2="170" data-from="S2" data-to="S3" data-edge="E-S2-S3" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="780" y1="102" x2="820" y2="102" data-from="S2" data-to="PredictionGap" data-edge="E-S2-GAP" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="840" y1="202" x2="880" y2="202" data-from="S3" data-to="Admit" data-edge="E-S3-ADMIT" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="580" y1="202" x2="500" y2="319" data-from="S3" data-to="S4" data-edge="E-S3-S4" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="500" y1="319" x2="540" y2="319" data-from="S4" data-to="S5" data-edge="E-S4-S5" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="770" y1="319" x2="810" y2="319" data-from="S5" data-to="S6" data-edge="E-S5-S6" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="810" y1="319" x2="690" y2="459" data-from="S6" data-to="S7" data-edge="E-S6-S7" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="1020" y1="319" x2="980" y2="452" data-from="S6" data-to="S8" data-edge="E-S6-S8" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="1210" y1="452" x2="1240" y2="452" data-from="S8" data-to="Unconfirmed" data-edge="E-S8-UNCONFIRMED" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="1240" y1="452" x2="690" y2="459" data-from="Unconfirmed" data-to="S7" data-edge="E-UNCONFIRMED-S7" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="690" y1="459" x2="720" y2="459" data-from="S7" data-to="StopError" data-edge="E-S7-STOP" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="495" y1="498" x2="615" y2="760" data-from="S7" data-to="LoopS1" data-edge="E-S7-LOOP" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><text x="517" y="523" font-size="11" font-family="sans-serif">retry remaining</text><line x1="615" y1="760" x2="250" y2="192" data-from="LoopS1" data-to="S1" data-edge="E-S7-S1" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="1095" y1="484" x2="920" y2="580" data-from="S8" data-to="S9" data-edge="E-S8-S9" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="915" y1="348" x2="920" y2="580" data-from="S6" data-to="S9" data-edge="E-S6-S9" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="720" y1="615" x2="145" y2="760" data-from="S9" data-to="S10" data-edge="E-S9-S10" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="250" y1="792" x2="280" y2="792" data-from="S10" data-to="StopP" data-edge="E-S10-STOP" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="145" y1="760" x2="145" y2="224" data-from="S10" data-to="S1" data-edge="E-S10-S1" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><text x="153" y="689" font-size="11" font-family="sans-serif">no stop</text><text x="40" y="880" font-size="12" font-family="sans-serif">no stop returns S10 to S1; retry back-edge is separate; CONFIRMED-NOT-SENT keeps q</text></svg>
