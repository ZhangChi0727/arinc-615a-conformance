<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" style="background:#FFFFFF"><desc id="plantuml-source"><![CDATA[
@startuml FIG-CL-TAV-01
skinparam shadowing false
title FIG-CL-TAV-01 Context\nSysML 1.6 notation-based views; executable/metamodel conformance is not claimed\nsubset of context relations; satisfy/verify are model relations, not executed verification

actor Operator
node TestAdapter
node IUT
node NetworkClock
cloud Integrity645 as "645 integrity boundary\nidentity bound; capability NOT-ESTABLISHED"

Operator --> TestAdapter : test request
TestAdapter --> IUT : stimulus
IUT --> TestAdapter : observation Izk
TestAdapter --> NetworkClock : time / error bound
IUT ..> Integrity645 : call and state only\nnot algorithm evidence
TestAdapter --> Msess : observation port to verification session
note bottom of IUT
  Protocol messages and operation states
  belong to Mprot, not to Msess.
end note
@enduml

]]></desc><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#181818"/></marker></defs><text x="20" y="24" font-size="16" font-family="sans-serif" font-weight="700">FIG-CL-TAV-01-context</text><text x="20" y="44" font-size="12" font-family="sans-serif">SysML 1.6 notation-based views; executable/metamodel conformance is not claimed</text><rect x="40" y="80" width="160" height="56" data-node="Operator" fill="#F7F7F7" stroke="#181818"/><text x="48" y="98" font-size="12" font-family="sans-serif"><tspan x="48" dy="0">Operator</tspan></text><rect x="260" y="80" width="160" height="56" data-node="TestAdapter" fill="#F7F7F7" stroke="#181818"/><text x="268" y="98" font-size="12" font-family="sans-serif"><tspan x="268" dy="0">TestAdapter</tspan></text><rect x="480" y="80" width="160" height="56" data-node="IUT" fill="#F7F7F7" stroke="#181818"/><text x="488" y="98" font-size="12" font-family="sans-serif"><tspan x="488" dy="0">IUT</tspan></text><rect x="700" y="80" width="200" height="56" data-node="NetworkClock" fill="#F7F7F7" stroke="#181818"/><text x="708" y="98" font-size="12" font-family="sans-serif"><tspan x="708" dy="0">NetworkClock</tspan></text><rect x="480" y="200" width="280" height="70" data-node="IntegrityBoundary" fill="#F7F7F7" stroke="#181818"/><text x="488" y="218" font-size="12" font-family="sans-serif"><tspan x="488" dy="0">IntegrityBoundary</tspan></text><rect x="260" y="320" width="280" height="56" data-node="MsessPort" fill="#F7F7F7" stroke="#181818"/><text x="268" y="338" font-size="12" font-family="sans-serif"><tspan x="268" dy="0">MsessPort</tspan></text><line x1="200" y1="108" x2="260" y2="108" data-from="Operator" data-to="TestAdapter" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="420" y1="108" x2="480" y2="108" data-from="TestAdapter" data-to="IUT" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/><line x1="640" y1="108" x2="700" y2="108" d