[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "a615a-sim"
version = "0.0.1"
description = "Dual-role ARINC 615A conformance simulation environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
# The installed-wheel regression deliberately uses --no-build-isolation, so
# the development/test environment must provide the declared build backend on
# all supported Python versions (notably Python 3.12+).
dev = ["pytest>=7.0", "setuptools>=61"]

[project.scripts]
a615a-sim = "a615a_sim.cli:main"
cltav-offline = "cltav_offline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cltav_offline.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
