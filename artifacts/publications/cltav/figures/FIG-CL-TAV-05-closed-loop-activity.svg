<text x="20" y="24" style="font-weight:bold;font-size:16px">FIG-CL-TAV-05 closed-loop activity</text><text x="20" y="44">Reader export; executable/metamodel conformance is not claimed</text>
<g id="nodes">
<rect data-node="S0" x="40" y="70" width="210" height="58"/><text x="48" y="95">S0 Idle; Gamma unique</text><rect data-node="S1" x="40" y="160" width="210" height="64"/><text x="48" y="195">S1 stop gate</text><rect data-node="S10" x="40" y="760" width="210" height="64"/><text x="48" y="795">S10 P-stops</text><rect data-node="StopP" x="280" y="760" width="190" height="64"/><text x="288" y="795">P-stop return</text><rect data-node="LoopS1" x="500" y="760" width="230" height="64"/><text x="508" y="795">retry back-edge to S1</text><rect data-node="StopGate" x="300" y="160" width="240" height="64"/><text x="308" y="195">S1 already decided stop</text>
